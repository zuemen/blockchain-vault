# 來源清單。tier 決定評分加權：primary > trade > aggregator
# primary = 監理機關、央行、公司 IR。這層最值錢，別人都不抓。

primary:
  # ── 美國 ──
  - name: FinCEN (Federal Register)
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=financial-crimes-enforcement-network
    # FinCEN 官網已無 RSS；改收 Federal Register 的 FinCEN 規則與公告（GTO、311 措施等），量少但都是一手
  - name: SEC Press Releases
    url: https://www.sec.gov/news/pressreleases.rss
  - name: OCC News
    url: https://www.occ.gov/rss/occ_news.xml
  - name: Federal Reserve Press
    url: https://www.federalreserve.gov/feeds/press_all.xml
  - name: CFTC Press Releases
    url: https://www.cftc.gov/RSS/RSSGP/rssgp.xml
  - name: FDIC Press Releases
    url: https://public.govdelivery.com/topics/USFDIC_26/feed.rss   # 官方託管在 GovDelivery；fdic.gov/rss.xml 只有理事會開會通知
  # ── 台灣 ──
  - name: 金管會新聞稿
    url: https://www.fsc.gov.tw/RSS/Messages?serno=201202290009&language=chinese   # 一次回傳多年，靠 --hours 過濾
  - name: 金管會法令函釋
    url: https://www.fsc.gov.tw/RSS/Newlaw?serno=201202290008&language=chinese
  # ── 香港 ──
  - name: HKMA Press Releases
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_press-release.xml   # 回傳一年份
  - name: SFC HK Press Releases
    url: https://www.sfc.hk/en/RSS-Feeds/Press-releases
  - name: SFC HK Circulars
    url: https://www.sfc.hk/en/RSS-Feeds/Circulars          # 含給虛擬資產服務商的通函
  # ── 國際組織與其他央行 ──
  - name: BIS Central Bank Speeches
    url: https://www.bis.org/doclist/cbspeeches.rss          # 全球央行演講彙整，量最大
  - name: BIS FSI Publications
    url: https://www.bis.org/doclist/bis_fsi_publs.rss       # 監理研究
  - name: FSB
    url: https://www.fsb.org/feed/                           # 全站 feed；/press/feed/ 已停更
  - name: ECB Press
    url: https://www.ecb.europa.eu/rss/press.html           # 含訪談、演講，不只新聞稿
  - name: Bank of England News
    url: https://www.bankofengland.co.uk/rss/news
  - name: ESMA
    url: https://www.esma.europa.eu/rss.xml
  - name: EBA News
    url: https://www.eba.europa.eu/news-press/news/rss.xml   # /rss.xml 是 e-mail alert，排序錯亂，別用
  - name: Japan FSA (EN)
    url: https://www.fsa.go.jp/fsaEnNewsList_rss2.xml
  # ── 身分／ZK 標準與研究 ──
  - name: DIF Blog
    url: https://blog.identity.foundation/rss/
  - name: ethresear.ch
    url: https://ethresear.ch/latest.rss                     # 以 ZK 研究為主
  # 查無穩定 feed，暫不收（2026-09-23 驗證）：
  #   MAS（/rss/* 回 HTML 404 頁；可改接官網 Solr JSON API，需另寫抓取分支並帶完整瀏覽器 UA）
  #   IMF（imf.org 整站被 Akamai 403 擋）、IOSCO（自 2023-05 停更）、
  #   韓國 FSC 英文版（只有韓文 feed，回應 20 秒以上且日期非標準）

trade:
  # ── 英文 ──
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss      # 結尾不能有斜線（會 308 轉址導致解析失敗）
  - name: The Block
    url: https://www.theblock.co/rss.xml
  - name: Cointelegraph
    url: https://cointelegraph.com/rss
  - name: Decrypt
    url: https://decrypt.co/feed
  - name: The Defiant
    url: https://thedefiant.io/api/feed
  - name: Ledger Insights
    url: https://www.ledgerinsights.com/feed/
  - name: Finextra Blockchain
    url: https://www.finextra.com/rss/channel.aspx?channel=blockchain
  - name: American Banker
    url: https://www.americanbanker.com/feed?rss=true        # 全站 feed，靠關鍵詞評分過濾
  - name: Banking Dive
    url: https://www.bankingdive.com/feeds/news/
  - name: Payments Dive
    url: https://www.paymentsdive.com/feeds/news/
  - name: PYMNTS Crypto
    url: https://www.pymnts.com/category/cryptocurrency/feed/
  - name: Chainalysis Blog
    url: https://www.chainalysis.com/blog/feed/
  # ── 數位身分 ──
  - name: Biometric Update (Digital ID)
    url: https://www.biometricupdate.com/tag/digital-identity/feed
  - name: SpruceID Blog
    url: https://blog.spruceid.com/rss/
  # ── 中文（量大，靠評分門檻過濾）──
  - name: 鏈新聞 ABMedia
    url: https://abmedia.io/feed
  - name: PANews
    url: https://www.panewslab.com/rss.xml?lang=zh&type=NEWS
  - name: 吳說區塊鏈
    url: https://www.wublock123.com/feed
  - name: TechFlow 深潮
    url: https://www.techflowpost.com/rss.aspx
  - name: Odaily
    url: https://rss.odaily.news/rss/post
  # 不收：動區動趨（/feed/ 回空 channel）、Galaxy Research（無 RSS）、Blockworks／DL News（feed 停更）、Foresight News（567）、
  #       ChainCatcher（一天 200+ 則且與上列重疊）

# 主題權重：命中越多、權重越高的詞，score 越高
weights:
  ZK: 3
  零知識: 3
  zero-knowledge: 3
  zk-proof: 3
  SSI: 3
  DID: 3
  verifiable credential: 3
  可驗證憑證: 3
  數位身分: 2
  RWA: 3
  "tokeniz*": 2
  "tokenis*": 2          # 英式拼法 tokenised / tokenisation
  代幣化: 2
  stablecoin: 2
  穩定幣: 2
  "settle*": 2          # settle / settled / settlement / settling
  結算: 2
  DvP: 3
  wCBDC: 3
  CBDC: 2
  "regulat*": 2         # regulation / regulatory / regulate
  法規: 2
  監理: 2
  金管會: 3
  FSC: 1
  HKMA: 2
  SFC: 2
  FinCEN: 3
  SEC: 2
  BIS: 2
  "custod*": 1          # custody / custodian / custodial
  "licens*": 2          # license / licensing / licensed
  licence: 2            # 英式拼法（c 結尾），licens* 比不到，單獨列
  deposit token: 3
  代幣化存款: 3
  託管: 1

# 雜訊詞：活動宣傳、空投、行銷。每命中一個扣 6 分（fetch_news.py 的 NOISE_PENALTY）
noise:
  - 晚宴
  - 酒會
  - 峰會
  - 論壇
  - 嘉賓
  - 報名
  - 贊助
  - 空投
  - airdrop
  - AMA
  - giveaway
  - 限時
  - 優惠
  - 將亮相
  - 盛大
  - 即將舉行

# 事件級去重門檻（標題關鍵詞 Jaccard 相似度），見 fetch_news.py 的 DEDUP_THRESHOLD
dedup_threshold: 0.35
