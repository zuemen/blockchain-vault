name: daily

on:
  schedule:
    - cron: "0 23 * * *"      # UTC 23:00 = 台北 07:00
  workflow_dispatch:
  push:
    branches: [main]          # 你自己寫完筆記 push 上來也會重建網站

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser pyyaml markdown

      - name: 抓新聞（僅 schedule / 手動觸發時）
        if: github.event_name != 'push'
        run: |
          HOURS=36
          [ "$(date -u +%u)" = "1" ] && HOURS=72   # 週一補週末
          python3 scripts/fetch_news.py --hours $HOURS --top 8

      - name: commit 新的事件卡
        if: github.event_name != 'push'
        run: |
          git config user.name  "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add 10-events 99-daily
          git diff --staged --quiet || git commit -m "news: $(date -u +%Y-%m-%d)"
          git push

      - name: 建站
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
